# A pipeline of daian: its boxes and arrows, and the generated files it owns. daian writes this file at every edit.
version: 1
generator: 1
pipeline: bird-accounts
name: BIRD accounts
description: Bronze copies of BIRD account and district from bird-cloud.
boxes:
  - id: twdnjegl
    kind: source
    name: account
    settings:
      connector: bird-cloud
      database: BIRD
      schema: null
      table: account
  - id: i13dlt0t
    kind: source
    name: district
    settings:
      connector: bird-cloud
      database: BIRD
      schema: null
      table: district
  - id: 7cj0n30v
    kind: bronze
    name: bird_cloud_account
    settings:
      key:
        - account_id
      refresh:
        mode: batch
        cron: "*/10 * * * *"
        time_zone: America/Buenos_Aires
        load: incremental
        cursor: date
  - id: eqwq1kmq
    kind: bronze
    name: bird_cloud_district
    settings:
      key:
        - district_id
      refresh:
        mode: trigger
        on: after
        after: 7cj0n30v
  - id: qs2cbf1q
    kind: silver
    name: account_districts
    settings:
      sql: |-
        SELECT
          SAFE_CAST(a.`account_id` AS INT64) AS account_id,
          SAFE_CAST(a.`date` AS DATE) AS opening_date,
          CASE TRIM(a.`frequency`)
            WHEN 'POPLATEK MESICNE' THEN 'monthly'
            WHEN 'POPLATEK TYDNE' THEN 'weekly'
            WHEN 'POPLATEK PO OBRATU' THEN 'after transaction'
          END AS statement_frequency,
          d.`A2` AS district_name,
          d.`A3` AS region,
          SAFE_CAST(d.`A4` AS INT64) AS inhabitants
        FROM {bird_cloud_account} AS a
        LEFT JOIN {bird_cloud_district} AS d
          ON SAFE_CAST(d.`district_id` AS INT64) = SAFE_CAST(a.`district_id` AS INT64)
        QUALIFY ROW_NUMBER() OVER (PARTITION BY SAFE_CAST(a.`account_id` AS INT64) ORDER BY SAFE_CAST(a.`date` AS DATE) DESC) = 1
      materialize: table
      key:
        - account_id
      checks:
        - type: not_null
          columns:
            - account_id
          severity: error
        - type: unique
          columns:
            - account_id
          severity: error
        - type: not_null
          columns:
            - opening_date
            - district_name
            - region
            - inhabitants
          severity: error
        - type: accepted_values
          column: statement_frequency
          values:
            - monthly
            - weekly
            - after transaction
          severity: error
      description: "One row per bank account (key: account_id) with the district it belongs to. Expect about 4,500 rows, one per account in BIRD.account; every account has a district."
      columns:
        - name: account_id
          description: The account's id in the BIRD bank.
        - name: opening_date
          description: Date the account was opened.
        - name: statement_frequency
          description: "How often statements are issued: monthly, weekly or after transaction (from the Czech POPLATEK codes)."
        - name: district_name
          description: Name of the account's district.
        - name: region
          description: Region the district belongs to (8 regions, e.g. Prague, south Moravia).
        - name: inhabitants
          description: Number of inhabitants of the district.
      quarantine: true
arrows:
  - from: twdnjegl
    to: 7cj0n30v
  - from: i13dlt0t
    to: eqwq1kmq
  - from: 7cj0n30v
    to: qs2cbf1q
  - from: eqwq1kmq
    to: qs2cbf1q
files:
  - definitions/daian/bi-test/bird-accounts/silver/account_districts.sqlx
  - definitions/daian/bi-test/bird-accounts/silver/account_districts_quarantine.sqlx
